<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love For You</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="styles.css">


</head>

<body class="bg-gradient-to-br from-rose-200 via-pink-200 to-red-200 min-h-screen flex items-center justify-center">

  <div class="text-center space-y-6">

    <h1 class="text-2xl md:text-3xl font-black text-rose-700 tracking-tight">
      💌 Hi Babe, Kindly Check Your Special Inbox
    </h1>

    <main class="flex justify-center">
      <img id="main-image" 
           src="assets/1.svg" 
           alt="letter"
           class="w-100 transition-all duration-700 ease-in-out animate-float drop-shadow-xl">
    </main>

    <div id="modal-container"></div>

    <div class="flex justify-center gap-6">
      <button id="btn-open"
        class="px-6 py-2 text-lg font-semibold bg-rose-500 text-white rounded-full shadow-lg
               hover:scale-110 hover:bg-rose-600 transition-all duration-300">
        Open 💕
      </button>

      <button id="btn-close"
        class="px-6 py-2 text-lg font-semibold bg-white/70 backdrop-blur text-rose-600 rounded-full shadow-md
               hover:scale-110 hover:bg-white transition-all duration-300">
        Reset
      </button>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
